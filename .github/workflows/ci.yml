name: tests
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
jobs:
  python:
    runs-on: ubuntu-latest
    strategy: { matrix: { python: ["3.10", "3.12"] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: python3 tests/run.py
      - name: browser copies match the scripts
        run: for f in brief.py lyric_meter.py suno_lint.py; do cmp scripts/$f docs/py/$f; done && cmp references/genres.json docs/py/genres.json
  size:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: test "$(du -sk --exclude=.git . | cut -f1)" -lt 3072   # repo under 3 MB
