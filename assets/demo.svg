<g class="v0"><clipPath id="k0"><rect class="c0" x="22" y="65" height="21" width="0"/></clipPath><text x="22" y="81" clip-path="url(#k0)"><tspan class="p">$</tspan> python3 scripts/brief.py --genre reggaeton --lang es --dj</text></g><text class="o v1" x="22" y="102" xml:space="preserve">suno-latin-producer brief  reggaeton  (DJ edit)</text><text class="o v2" x="22" y="123" xml:space="preserve">tempo 94 BPM (range 88-100) · key F minor · mood playful · vocal male · lang es · seed 4</text><text class="o v3" x="22" y="144" xml:space="preserve"></text><text class="o v4" x="22" y="165" xml:space="preserve">A  [base] reggaeton, 94 BPM, F minor, playful, bouncy, deep 808 bass, dembow drums,</text><text class="o v5" x="22" y="186" xml:space="preserve">sub-heavy club mix, warm male vocal, Spanish-language vocals, Latin American Spanish,</text><text class="o v6" x="22" y="207" xml:space="preserve">extended instrumental intro, extended instrumental outro, DJ-friendly arrangement</text><text class="o v7" x="22" y="228" xml:space="preserve"></text><text class="o v8" x="22" y="249" xml:space="preserve">Structure (perreo)</text><text class="o v9" x="22" y="270" xml:space="preserve">  [Intro] [Hook] [Verse 1] [Hook] [Verse 2] [Hook] [Breakdown] [Hook] [Outro]</text><text class="o v10" x="22" y="291" xml:space="preserve"></text><g class="v11"><clipPath id="k11"><rect class="c11" x="22" y="296" height="21" width="0"/></clipPath><text x="22" y="312" clip-path="url(#k11)"><tspan class="p">$</tspan> python3 scripts/lyric_meter.py luna-de-neon.es.txt</text></g><text class="o v12" x="22" y="333" xml:space="preserve">lyric_meter  examples/lyrics/luna-de-neon.es.txt  (lang: es)</text><text class="o v13" x="22" y="354" xml:space="preserve">[Hook]         4 lines · syllables 5-12 · scheme Aaaa</text><text class="o v14" x="22" y="375" xml:space="preserve">   1  10  Luna de neón, prende la ciudad               A</text><text class="o v15" x="22" y="396" xml:space="preserve">   2  10  Baila sin razón, nadie va a mirar            a</text><text class="o v16" x="22" y="417" xml:space="preserve">   3  12  Luna de neón, quédate un poquito más         a</text><text class="o v17" x="22" y="438" xml:space="preserve">   4   5  (un poquito más)                             a</text><text class="o v18" x="22" y="459" xml:space="preserve">[Verse 2]      4 lines · syllables 11-12 · scheme AABB</text><text class="o v19" x="22" y="480" xml:space="preserve">   1  11  Dos de la mañana y nadie quiere irse         A</text><text class="o v20" x="22" y="501" xml:space="preserve">   2  11  El DJ baja el tempo para despedirse          A</text><text class="o v21" x="22" y="522" xml:space="preserve">   3  12  Tu sombra en la pared dibuja una canción     B</text><text class="o v22" x="22" y="543" xml:space="preserve">   4  11  Y el piso se mueve con el corazón            B</text><text class="o v23" x="22" y="564" xml:space="preserve">+ no length or rhyme warnings</text><text class="o v24" x="22" y="585" xml:space="preserve"></text><g class="v25"><clipPath id="k25"><rect class="c25" x="22" y="590" height="21" width="0"/></clipPath><text x="22" y="606" clip-path="url(#k25)"><tspan class="p">$</tspan> python3 scripts/suno_lint.py luna-de-neon.es.txt --dj</text></g><text class="o v26" x="22" y="627" xml:space="preserve">suno_lint  examples/lyrics/luna-de-neon.es.txt</text><text class="o v27" x="22" y="648" xml:space="preserve">+ clean: 0 errors, 0 warnings</text>
